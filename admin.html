<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gymnos · Administrar web</title>
<style>body{font-family:system-ui;margin:0;background:#f4f6f2;color:#161916}.wrap{max-width:920px;margin:auto;padding:24px}h1{margin:0 0 6px}.box{background:#fff;border:1px solid #dfe4dc;border-radius:16px;padding:18px;margin:16px 0}label{font-weight:800;display:block;margin:10px 0 5px}input,textarea,select{width:100%;padding:11px;border:1px solid #cdd4ca;border-radius:9px;font:inherit}textarea{min-height:80px}button{border:0;border-radius:10px;padding:12px 16px;font-weight:900;cursor:pointer}.save{background:#5c8f4e;color:white}.secondary{background:#e8ece6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:grid;grid-template-columns:90px repeat(6,1fr);gap:5px;align-items:center;margin:6px 0}.row input{padding:7px;font-size:12px}.activity{border-top:1px solid #eee;padding-top:12px;margin-top:12px}.status{font-weight:800;margin-left:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.row{grid-template-columns:70px repeat(6,120px);overflow:auto}.box{overflow:auto}}</style></head><body><div class="wrap"><h1>Administrar Gymnos</h1><p>Cambiá textos, horarios y fotos. Guardar publica los cambios.</p>
<div class="box"><label>Clave de administrador</label><input id="password" type="password" autocomplete="current-password"><button class="secondary" onclick="loadData()">Cargar contenido</button><span class="status" id="status"></span></div>
<div id="editor" hidden>
<div class="box"><h2>Portada</h2><label>Texto chico</label><input id="heroEyebrow"><label>Título</label><textarea id="heroTitle"></textarea><label>Descripción</label><textarea id="heroText"></textarea><label>Foto de portada</label><input type="file" accept="image/*" onchange="uploadImage(this,'heroImage')"><input id="heroImage"></div>
<div class="box"><h2>Contacto</h2><div class="grid"><div><label>Dirección</label><input id="address"></div><div><label>Teléfono visible</label><input id="phoneDisplay"></div><div><label>WhatsApp (código país + número)</label><input id="whatsapp"></div><div><label>Instagram</label><input id="instagram"></div></div></div>
<div class="box"><h2>Actividades</h2><div id="activities"></div></div>
<div class="box"><h2>Horarios</h2><p>Columnas: hora, lunes, martes, miércoles, jueves, viernes, sábado.</p><div id="schedule"></div></div>
<div class="box"><h2>Galería</h2><div id="gallery"></div></div>
<button class="save" onclick="saveData()">Guardar y publicar</button><span class="status" id="saveStatus"></span>
</div></div>
<script>
let data;
const $=id=>document.getElementById(id);
async function loadData(){try{data=await (await fetch('/api/content',{cache:'no-store'})).json();render();$('editor').hidden=false;$('status').textContent='✓ Contenido cargado'}catch(e){$('status').textContent='Error al cargar'}}
function render(){ $('heroEyebrow').value=data.hero.eyebrow||'';$('heroTitle').value=(data.hero.title||'').replace(/\\n/g,'\n');$('heroText').value=data.hero.text||'';$('heroImage').value=data.heroImage||'';$('address').value=data.contact.address||'';$('phoneDisplay').value=data.contact.phoneDisplay||'';$('whatsapp').value=data.contact.whatsapp||'';$('instagram').value=data.contact.instagram||'';
$('activities').innerHTML='';data.activities.forEach((a,i)=>{$('activities').insertAdjacentHTML('beforeend',`<div class="activity"><div class="grid"><div><label>Nombre</label><input id="an${i}" value="${esc(a.name)}"></div><div><label>Foto</label><input type="file" accept="image/*" onchange="uploadImage(this,'ai${i}')"><input id="ai${i}" value="${esc(a.image)}"></div></div><label>Descripción</label><textarea id="at${i}">${esc(a.text)}</textarea></div>`)});
$('schedule').innerHTML='';data.schedule.forEach((r,i)=>{$('schedule').insertAdjacentHTML('beforeend',`<div class="row">${r.map((v,j)=>`<input id="s${i}_${j}" value="${esc(v)}">`).join('')}</div>`)});
$('gallery').innerHTML='';data.gallery.forEach((v,i)=>{$('gallery').insertAdjacentHTML('beforeend',`<div class="grid"><input type="file" accept="image/*" onchange="uploadImage(this,'g${i}')"><input id="g${i}" value="${esc(v)}"></div>`)});
}
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
async function uploadImage(input,target){if(!input.files[0])return;const f=input.files[0];if(f.size>3_000_000){alert('La foto debe pesar menos de 3 MB');return}const dataUrl=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});const rr=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':$('password').value},body:JSON.stringify({filename:f.name,dataUrl})});const out=await rr.json();if(!rr.ok){alert(out.error||'No se pudo subir');return}$(target).value=out.url;alert('Foto cargada. Tocá Guardar y publicar.')}
async function saveData(){data.hero={eyebrow:$('heroEyebrow').value,title:$('heroTitle').value,text:$('heroText').value};data.heroImage=$('heroImage').value;data.contact={address:$('address').value,phoneDisplay:$('phoneDisplay').value,whatsapp:$('whatsapp').value,instagram:$('instagram').value};data.activities=data.activities.map((a,i)=>({name:$(`an${i}`).value,text:$(`at${i}`).value,image:$(`ai${i}`).value}));data.schedule=data.schedule.map((r,i)=>r.map((_,j)=>$(`s${i}_${j}`).value));data.gallery=data.gallery.map((_,i)=>$(`g${i}`).value);$('saveStatus').textContent='Guardando…';const rr=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':$('password').value},body:JSON.stringify(data)});const out=await rr.json();$('saveStatus').textContent=rr.ok?'✓ Publicado':(out.error||'Error')}
</script></body></html>
